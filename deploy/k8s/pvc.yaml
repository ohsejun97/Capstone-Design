# 모델 가중치와 HF 캐시를 이미지 밖에 둔다 (Dockerfile.api 주석 참조).
# k3s 기본 local-path 프로비저너를 쓰므로 단일 노드에서만 성립한다.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fusiondti-models
  namespace: fusiondti
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fusiondti-hf-cache
  namespace: fusiondti
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
