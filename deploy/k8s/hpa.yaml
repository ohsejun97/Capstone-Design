# UI만 오토스케일한다. API는 GPU 1장에 묶여 있어 확장 대상이 아니다.
# 전제: metrics-server가 떠 있어야 한다 (k3s는 기본 포함).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fusiondti-ui
  namespace: fusiondti
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fusiondti-ui
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      # Streamlit은 세션이 붙어 있으므로 급하게 줄이면 사용자가 끊긴다.
      stabilizationWindowSeconds: 300
